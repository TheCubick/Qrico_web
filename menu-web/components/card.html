<article class="tarjeta-toks swiper-slide {{clase}}" data-open="{{id}}" tabindex="0" aria-label="{{nombre}}, {{precio}}">
    <div class="img-contenedor">
        {{imagen}}
        {{badge}}
    </div>

    <div class="info-contenedor">
        <span class="tarjeta-categoria">{{categoria}}</span>
        <h3>{{nombre}}</h3>
        <div class="tarjeta-pie">
            <div class="tarjeta-precio">
                <span class="precio-actual q-mono">{{precio}}</span>
                {{precioAnterior}}
            </div>
            <div class="control-carrito" data-control="{{id}}" data-variante="pill"></div>
        </div>
    </div>
</article>
