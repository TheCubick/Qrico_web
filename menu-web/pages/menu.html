<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#D1312B">
    <link rel="icon" type="image/png" href="../assets/images/logo/logomin.png">
    <title>Menú | Q-RICO</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://images.unsplash.com">

    <!-- Librerías de animación (instaladas con npm y copiadas a shared/vendor/) -->
    <link rel="stylesheet" href="../../shared/vendor/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../../shared/vendor/lenis/lenis.css">

    <!-- Sistema de diseño + módulos -->
    <link rel="stylesheet" href="../../shared/css/tokens.css">
    <link rel="stylesheet" href="../assets/styles/menu.css">
    <link rel="stylesheet" href="../assets/styles/header.css">
    <link rel="stylesheet" href="../assets/styles/card.css">
    <link rel="stylesheet" href="../assets/styles/cuadro_card.css">
    <link rel="stylesheet" href="../assets/styles/footer.css">
</head>
<body class="comensal">

    <div id="app-qrico">
        <!-- 1. HEADER coral + drawer del pedido (header.html) -->
        <div id="contenedor-header"></div>

        <main id="menu-main">
            <!-- 2. BANNER PROMOCIONAL: carrusel táctil (Swiper) -->
            <section class="hero-banner" id="hero" aria-label="Promociones">
                <div class="swiper hero-swiper" id="hero-swiper">
                    <div class="swiper-wrapper" id="hero-slides"></div>
                </div>
                <button class="arrow-btn left" id="hero-prev" aria-label="Promoción anterior"><i data-lucide="chevron-left"></i></button>
                <button class="arrow-btn right" id="hero-next" aria-label="Siguiente promoción"><i data-lucide="chevron-right"></i></button>
                <div class="puntos-carrusel" id="hero-puntos"></div>
            </section>

            <!-- Cintilla del negocio en una sola línea: horario, cómo llegar y WiFi -->
            <section class="cintilla-info" id="cintilla-info" aria-label="Información del restaurante"></section>

            <!-- Seguimiento del pedido en vivo -->
            <section class="tracker" id="tracker" aria-live="polite" hidden></section>

            <!-- 3. Barra sticky de una sola fila: categorías + buscador (sidebar.html) -->
            <div id="contenedor-sidebar" class="catbar-slot"></div>

            <!-- 4. FAVORITOS DE LA CASA: tarjetas verticales (card.html) en carrusel con perspectiva 3D -->
            <section class="seccion-favoritos" id="sec-favoritos" data-seccion aria-labelledby="titulo-favoritos">
                <header class="seccion-cabecera">
                    <span class="eyebrow"><i data-lucide="star"></i> Lo más pedido</span>
                    <h2 class="titulo-seccion" id="titulo-favoritos">Favoritos de la <span>casa</span></h2>
                </header>
                <div class="favoritos-carrusel">
                    <button class="flecha-carrusel flecha-carrusel--prev" id="fav-prev" aria-label="Favorito anterior"><i data-lucide="chevron-left"></i></button>
                    <div class="swiper favoritos-swiper" id="favoritos-swiper">
                        <div class="swiper-wrapper" id="contenedor-favoritos"></div>
                    </div>
                    <button class="flecha-carrusel flecha-carrusel--next" id="fav-next" aria-label="Siguiente favorito"><i data-lucide="chevron-right"></i></button>
                </div>
                <div class="favoritos-puntos" id="favoritos-puntos"></div>
            </section>

            <!-- 5. MENÚ COMPLETO: una banda por categoría, blanco y crema alternados (cuadro_card.html) -->
            <div id="contenedor-secciones"></div>

            <section class="banda banda--blanco" id="sin-resultados" hidden>
                <div class="seccion-interior">
                    <div class="q-empty sin-resultados">
                        <i data-lucide="search-x"></i>
                        <strong>No encontramos ese platillo</strong>
                        <span>Prueba con otra palabra o un ingrediente.</span>
                        <button class="q-btn q-btn--outline" id="btn-limpiar-busqueda">Limpiar búsqueda</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- 6. FOOTER clásico (footer.html) -->
        <div id="contenedor-footer"></div>
    </div>

    <!-- 7. Barra flotante: aparece solo con platillos en el pedido o un pedido en curso.
            El botón de asistencia existe únicamente si se entró con el QR de una mesa. -->
    <div class="pedido-flotante" id="pedido-flotante">
        <button class="asistencia-btn" id="btn-asistencia" hidden aria-label="Asistencia en tu mesa">
            <i data-lucide="bell-ring"></i>
            <span class="asistencia-btn__mesa" id="asistencia-mesa">Mesa</span>
        </button>
        <button class="barra-pedido" id="btn-barra-pedido" hidden>
            <span class="barra-pedido__icono" id="barra-icono"><i data-lucide="shopping-bag"></i></span>
            <span class="barra-pedido__label" id="barra-label">Ver mi pedido</span>
            <span class="barra-pedido__total q-mono" id="barra-total">$0.00</span>
        </button>
    </div>

    <!-- Librerías -->
    <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
    <script src="../../shared/vendor/gsap/gsap.min.js"></script>
    <script src="../../shared/vendor/gsap/ScrollTrigger.min.js"></script>
    <script src="../../shared/vendor/gsap/Flip.min.js"></script>
    <script src="../../shared/vendor/swiper/swiper-bundle.min.js"></script>
    <script src="../../shared/vendor/lenis/lenis.min.js"></script>
    <script src="../../shared/vendor/canvas-confetti/confetti.browser.js"></script>
    <!-- Núcleo compartido -->
    <script src="../../shared/js/store.js"></script>
    <script src="../../shared/js/ui.js"></script>
    <!-- Lógica del comensal -->
    <script src="../assets/scripts/menu.js"></script>
</body>
</html>
