<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/logo/logomin.png">
    <title>Menú | Q-RICO</title>
    
    <!-- Íconos y Fuentes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Enlaces CSS -->
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/cuadro_card.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>
    
    <div id="app-qrico">
        
        <!-- 1. HEADER (Inyectado por JS) -->
        <div id="contenedor-header"></div>
        
        <main>
            <!-- 2. BANNER PROMOCIONAL (Tipo Carrusel) -->
            <section class="hero-banner">
                <button class="arrow-btn left" onclick="cambiarSlide(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                
                <div class="banner-content">
                    <!-- Agregamos onerror para que muestre un color de respaldo si no encuentra tus imágenes locales -->
                    <div class="slide activa">
                        <img src="../img/complementos/asian.jpeg" alt="Promo 1" onerror="this.onerror=null; this.src='https://placehold.co/1600x400/1A1A1A/F47920?text=Banner+1+(Tus+imagenes+estan+en+otra+ruta)';">
                    </div>
                    <div class="slide">
                        <img src="../img/complementos/carne.jpeg" alt="Promo 2" onerror="this.onerror=null; this.src='https://placehold.co/1600x400/333333/FFFFFF?text=Banner+2';">
                    </div>
                    <div class="slide">
                        <img src="../img/complementos/cofee.jpeg" alt="Promo 3" onerror="this.onerror=null; this.src='https://placehold.co/1600x400/000000/F47920?text=Banner+3';">
                    </div>
                </div>

                <button class="arrow-btn right" onclick="cambiarSlide(1)"><i class="fa-solid fa-chevron-right"></i></button>
                
                <div class="puntos-carrusel">
                    <span class="punto activo" onclick="irASlide(0)"></span>
                    <span class="punto" onclick="irASlide(1)"></span>
                    <span class="punto" onclick="irASlide(2)"></span>
                </div>
            </section>

            <!-- 3. CATEGORÍAS CIRCULARES (Tipo Toks) -->
            <section class="seccion-categorias">
                <h2 class="titulo-seccion">MENÚ PARA <span class="texto-naranja">ORDENAR EN LÍNEA</span></h2>
                
                <div class="burbujas-contenedor">
                    <div class="burbuja-categoria activa">
                        <div class="icono-box"><i class="fa-solid fa-percent"></i></div>
                        <span>Se me antoja<br>Q-Rico</span>
                    </div>
                    <div class="burbuja-categoria">
                        <div class="icono-box"><i class="fa-solid fa-bell-concierge"></i></div>
                        <span>De Temporada</span>
                    </div>
                    <div class="burbuja-categoria">
                        <div class="icono-box"><i class="fa-solid fa-burger"></i></div>
                        <span>Combos</span>
                    </div>
                    <div class="burbuja-categoria">
                        <div class="icono-box"><i class="fa-solid fa-mug-hot"></i></div>
                        <span>Bebidas</span>
                    </div>
                </div>
            </section>

            <!-- 4. MENÚ DE RESTAURANTE (Tarjetas) -->
            <section class="seccion-carrusel-tarjetas">
                <div class="controles-carrusel-tarjetas">
                    <i class="fa-solid fa-angle-left flecha-carrusel"></i>
                    <div class="pista-tarjetas" id="contenedor-productos">
                        <!-- Las tarjetas aparecen aquí -->
                    </div>
                    <i class="fa-solid fa-angle-right flecha-carrusel"></i>
                </div>
            </section>

            <!-- 5. NUEVA SECCIÓN: CUADRÍCULA DE PLATILLOS DETALLADOS -->
            <section class="seccion-menu-completo">
                <h2 class="titulo-seccion">PLATILLOS <span class="texto-naranja">DESTACADOS</span></h2>
                <div class="cuadricula-productos" id="contenedor-cuadricula">
                    <!-- Los cuadros horizontales se inyectarán aquí -->
                </div>
            </section>

        </main>
    <!-- 6. FOOTER (Inyectado por JS) -->
        <div id="contenedor-footer"></div>
        
    </div>

    <script src="../js/menu.js"></script>
</body>
</html>
