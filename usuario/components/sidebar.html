<div class="catbar" id="catbar">
    <div class="catbar__inner">
        <div class="catbar__top">
            <label class="search" for="buscador">
                <i data-lucide="search"></i>
                <input type="search" id="buscador" placeholder="Busca tacos, café, postres…" autocomplete="off">
                <button type="button" class="search__clear" id="buscador-limpiar" aria-label="Limpiar búsqueda" hidden><i data-lucide="x"></i></button>
            </label>
            <div class="filters" role="group" aria-label="Filtros rápidos">
                <button class="filter" data-filter="destacados"><i data-lucide="star"></i> Favoritos</button>
                <button class="filter" data-filter="rapidos"><i data-lucide="timer"></i> Menos de 15 min</button>
                <button class="filter" data-filter="disponibles"><i data-lucide="circle-check"></i> Disponibles</button>
            </div>
        </div>
        <nav class="catbar__chips" id="chips-categorias" aria-label="Categorías"></nav>
    </div>
</div>
