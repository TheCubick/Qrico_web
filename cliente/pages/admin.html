<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E1B18">
    <link rel="icon" type="image/png" href="../../usuario/assets/images/logo/logomin.png">
    <title>Panel | Q-RICO</title>
    <script>
        // Sin sesión activa → regreso al acceso por PIN
        if (!sessionStorage.getItem('qrico_sesion')) location.replace('../index.html');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../shared/css/tokens.css">
    <link rel="stylesheet" href="../assets/styles/admin.css">
    <link rel="stylesheet" href="../assets/styles/admin_sidebar.css">
</head>
<body class="admin-body" data-page="admin">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="admin-layout">
        <!-- Sidebar (components/admin_sidebar.html) -->
        <div id="sidebar-container" class="sidebar-slot"></div>

        <div class="admin-main">
            <!-- Topbar -->
            <header class="topbar">
                <button class="q-icon-btn topbar__menu" id="btn-menu-movil" aria-label="Abrir menú"><i data-lucide="menu"></i></button>
                <div class="topbar__title">
                    <span class="eyebrow" id="topbar-negocio">Restaurante</span>
                    <h1 id="topbar-vista">Cargando…</h1>
                </div>

                <div class="topbar__actions">
                    <div class="topbar__clock q-mono" id="reloj-admin">--:--</div>

                    <a class="q-btn q-btn--outline q-btn--sm topbar__menu-link" href="../../usuario/" target="_blank" rel="noopener">
                        <i data-lucide="smartphone"></i><span>Menú QR</span>
                    </a>

                    <div class="topbar__dropdown-wrap">
                        <button class="q-icon-btn topbar__bell" id="btn-alertas" aria-label="Alertas de mesas">
                            <i data-lucide="bell"></i>
                            <span class="topbar__badge q-mono" id="alertas-count" hidden>0</span>
                        </button>
                        <div class="dropdown dropdown--alerts" id="dropdown-alertas" hidden></div>
                    </div>

                    <div class="topbar__dropdown-wrap">
                        <button class="profile-btn" id="btn-perfil">
                            <span class="avatar" id="perfil-avatar">--</span>
                            <span class="profile-btn__text">
                                <strong id="perfil-nombre">Usuario</strong>
                                <span id="perfil-rol">Rol</span>
                            </span>
                            <i data-lucide="chevron-down"></i>
                        </button>
                        <div class="dropdown dropdown--profile" id="dropdown-perfil" hidden>
                            <div class="dropdown__header">
                                <span class="q-muted">Sesión activa</span>
                                <strong id="dropdown-nombre">Usuario</strong>
                            </div>
                            <button class="dropdown__item" id="btn-cambiar-usuario"><i data-lucide="users"></i> Cambiar de usuario</button>
                            <button class="dropdown__item dropdown__item--danger" id="btn-cerrar-sesion"><i data-lucide="log-out"></i> Cerrar sesión</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Vistas dinámicas (components/views/*.html) -->
            <main class="admin-content" id="admin-main-content">
                <div class="view-loading"><span class="spinner"></span> Cargando…</div>
            </main>
        </div>
    </div>

    <!-- Librerías -->
    <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
    <!-- Núcleo compartido -->
    <script src="../../shared/js/store.js"></script>
    <script src="../../shared/js/ui.js"></script>
    <!-- Panel -->
    <script src="../assets/scripts/admin.js"></script>
</body>
</html>
