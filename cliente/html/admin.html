<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/logo/logomin.png">
    <title>Q-RICO | Panel de Control</title>
    
    <!-- Íconos y Fuentes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS del Admin -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin_sidebar.css">
</head>
<body class="admin-body">

    <!-- STREAMING_CHUNK: Pantalla de Acceso Seguro (PIN) -->
    <div id="pantalla-bloqueo" class="pantalla-bloqueo">
        <div class="bloqueo-logo">
            <i class="fa-solid fa-border-all"></i>
            <h1>Q-RICO</h1>
            <p style="color: #64748B;">Ingresa tu NIP de acceso</p>
        </div>

        <div id="pin-display" class="pin-display">----</div>

        <div class="pin-pad" id="teclado-pin">
            <button class="pin-btn">1</button>
            <button class="pin-btn">2</button>
            <button class="pin-btn">3</button>
            <button class="pin-btn">4</button>
            <button class="pin-btn">5</button>
            <button class="pin-btn">6</button>
            <button class="pin-btn">7</button>
            <button class="pin-btn">8</button>
            <button class="pin-btn">9</button>
            <button class="pin-btn" style="background:transparent; border:none; color:#EF4444;" id="btn-borrar-pin"><i class="fa-solid fa-delete-left"></i></button>
            <button class="pin-btn">0</button>
            <button class="pin-btn" style="background:transparent; border:none;"></button>
        </div>
    </div>

    <!-- 1. Fondo oscuro para móvil (Nuevo) -->
    <div id="overlay-sidebar" class="overlay-sidebar"></div>

    <div class="admin-layout">
        
        <!-- CONTENEDOR DEL SIDEBAR (Se inyecta con JS) -->
        <div id="sidebar-container"></div>

        <!-- ÁREA DE TRABAJO DERECHA -->
        <div class="admin-main">
            
            <!-- TOPBAR (Barra Superior Estática) -->
            <header class="admin-topbar">
                <!-- 2. Botón de menú móvil (Nuevo) -->
                <button id="btn-menu-movil"><i class="fa-solid fa-bars"></i></button>

                <div class="topbar-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar orden, folio o mesa...">
                </div>
                
                <div class="topbar-actions">
                    <div class="topbar-clock" id="reloj-admin">
                        <i class="fa-regular fa-clock"></i> <span>Cargando...</span>
                    </div>
                    
                    <button class="btn-icon"><i class="fa-regular fa-bell"></i><span class="badge">3</span></button>
                    
                    <div class="topbar-profile" id="btn-profile-menu">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=F47920&color=fff" alt="Usuario" id="avatar-usuario">
                        <div class="profile-info">
                            <span class="name" id="nombre-usuario">...</span>
                            <span class="role" id="rol-usuario">...</span>
                        </div>
                        <i class="fa-solid fa-chevron-down" id="icono-chevron-perfil"></i>
                        
                        <div class="profile-dropdown" id="dropdown-perfil">
                            <div class="dropdown-header">
                                <p>Conectado como</p>
                                <strong id="dropdown-nombre">...</strong>
                            </div>
                            <hr>
                            <a href="#" class="dropdown-item"><i class="fa-regular fa-user"></i> Mi Perfil</a>
                            <a href="#" class="dropdown-item"><i class="fa-solid fa-gear"></i> Ajustes</a>
                            <hr>
                            <a href="#" class="dropdown-item text-danger" id="btn-cerrar-sesion"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- CONTENEDOR DINÁMICO (Aquí cambian las pantallas) -->
            <main class="admin-content" id="admin-main-content">
                <div class="loading-state">Cargando sistema...</div>
            </main>
            
        </div>
    </div>

    <!-- Librería de Gráficas Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Script principal del Admin -->
    <script src="../js/admin.js"></script>
</body>
</html>
